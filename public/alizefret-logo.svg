<svg width="400" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- AlizeFret Logo SVG -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Airplane icon -->
  <g transform="translate(280, 30)">
    <path d="M20 8 L25 6 L27 8 L25 10 L22 9 L18 12 L20 14 L15 16 L13 14 L11 16 L9 14 L11 12 L15 9 Z" 
          fill="#1E88E5" stroke="#0D47A1" stroke-width="0.5"/>
  </g>
  
  <!-- "alize" text in cursive style -->
  <text x="20" y="65" font-family="'Brush Script MT', cursive, 'Arial'" font-size="48" 
        font-style="italic" font-weight="400" fill="url(#blueGradient)">
    alize
  </text>
  
  <!-- "FRET" text in bold -->
  <text x="180" y="65" font-family="'Arial Black', 'Arial', sans-serif" font-size="42" 
        font-weight="900" fill="#0D47A1" letter-spacing="2">
    FRET
  </text>
  
  <!-- "ENVOI COLIS GP" subtitle -->
  <rect x="180" y="72" width="140" height="16" fill="#1E88E5"/>
  <text x="250" y="84" font-family="Arial, sans-serif" font-size="11" 
        font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">
    ENVOI COLIS GP
  </text>
</svg>
